<title>PSD 标注</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --blue: #2f7df6; --blue-light: rgba(47,125,246,.12);
    --border: #e5e7eb; --bg: #f5f6f8; --panel: #fff;
    --text: #1f2329; --text2: #6b7280;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  /* ---------- 顶栏 ---------- */
  .topbar { height: 52px; background: var(--panel); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 14px; padding: 0 16px; }
  .logo { font-weight: 700; font-size: 15px; }
  .logo span { color: var(--blue); }
  .doc-select { flex: 0 1 320px; }
  .doc-select select { width: 100%; height: 32px; border: 1px solid var(--border);
    border-radius: 6px; padding: 0 8px; font-size: 13px; background: #fff; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: 6px;
         background: #fff; font-size: 13px; cursor: pointer; color: var(--text);
         display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { opacity: .9; color: #fff; }
  .topbar .spacer { flex: 1; }
  .doc-info { font-size: 12px; color: var(--text2); }

  /* ---------- 单位切换 ---------- */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
         overflow: hidden; height: 32px; }
  .seg button { border: none; background: #fff; padding: 0 14px; font-size: 13px;
                cursor: pointer; color: var(--text2); border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--blue); color: #fff; font-weight: 600; }
  .zoom-hint { font-size: 11px; color: #9ca3af; }

  /* ---------- 布局 ---------- */
  .layout { display: flex; height: calc(100vh - 52px); position: relative; }
  .sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-head { padding: 10px 14px; font-size: 12px; color: var(--text2);
                  border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .layer-tree { flex: 1; overflow: auto; padding: 6px 0; }
  .layer-item { display: flex; align-items: center; gap: 6px; padding: 5px 12px;
                font-size: 13px; cursor: pointer; white-space: nowrap; }
  .layer-item:hover { background: var(--blue-light); }
  .layer-item.active { background: var(--blue-light); color: var(--blue); font-weight: 600; }
  .layer-item .icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 12px; }
  .layer-item .nm { overflow: hidden; text-overflow: ellipsis; }
  .layer-item.hidden-layer { opacity: .4; }
  .layer-item .arrow { width: 12px; flex-shrink: 0; font-size: 10px; color: var(--text2); cursor: pointer; }

  /* ---------- 画布 ---------- */
  .canvas-wrap { flex: 1; overflow: auto; position: relative;
                 background: repeating-conic-gradient(#eceef1 0% 25%, #f7f8fa 0% 50%) 50% / 20px 20px; }
  .stage { position: relative; margin: 24px auto; box-shadow: 0 2px 16px rgba(0,0,0,.12);
           background: #fff; }
  .stage img.composite { display: block; width: 100%; height: 100%; user-select: none;
                         -webkit-user-drag: none; }
  .hotspot { position: absolute; cursor: pointer; }
  .hotspot:hover { outline: 2px solid var(--blue); outline-offset: -2px; background: rgba(47,125,246,.10); }
  .hotspot.selected { outline: 2px solid var(--blue); outline-offset: -2px;
                      background: rgba(47,125,246,.08); }
  .dim-label { position: absolute; pointer-events: none; font-size: 11px; line-height: 1;
    background: var(--blue); color: #fff; padding: 3px 6px; border-radius: 3px;
    white-space: nowrap; display: none; z-index: 5; }
  .dim-label.show { display: block; }

  /* ---------- 跟随鼠标的测量标注 ---------- */
  #guides { position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6; }
  #guides .xhair { stroke: rgba(47,125,246,.45); stroke-width: 1.5; stroke-dasharray: 6 5; }
  #guides .measure { stroke: #ff4d6a; stroke-width: 2; }
  #guides .edge-tick { stroke: #ff4d6a; stroke-width: 2; }
  #guides .snap-rect { fill: rgba(255,159,10,.08); stroke: #ff9f0a; stroke-width: 2;
                       stroke-dasharray: 7 5; }
  .guide-label { position: absolute; pointer-events: none; z-index: 7; font-size: 11px;
    line-height: 1.3; background: #ff4d6a; color: #fff; padding: 3px 7px;
    border-radius: 3px; white-space: nowrap; transform: translate(-50%, -50%);
    display: none; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .guide-label.show { display: block; }
  .guide-label.pos { background: rgba(31,35,41,.85); transform: translate(12px, 14px); }

  /* 吸附目标提示：固定在画布左上角 */
  .snap-hint { position: absolute; left: 272px; top: 12px; z-index: 20; display: none;
    background: #ff9f0a; color: #fff; font-size: 12px; padding: 5px 12px;
    border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.25); pointer-events: none; }
  .snap-hint.show { display: block; }

  .zoom-ctrl { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 10; }
  .zoom-ctrl .btn { height: 30px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }

  /* ---------- 右侧详情 ---------- */
  .detail { width: 320px; background: var(--panel); border-left: 1px solid var(--border);
            overflow: auto; flex-shrink: 0; }
  .detail-empty { padding: 40px 20px; text-align: center; color: var(--text2); font-size: 13px; }
  .detail-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .detail-head .name { font-size: 15px; font-weight: 700; word-break: break-all; }
  .detail-head .kind { display: inline-block; font-size: 11px; color: var(--blue);
    background: var(--blue-light); padding: 2px 8px; border-radius: 10px; margin-top: 8px; }
  .detail-body { padding: 14px 16px; }
  .sec-title { font-size: 12px; color: var(--text2); margin: 14px 0 8px; font-weight: 600; }
  .sec-title:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0;
        border-bottom: 1px dashed #f0f0f0; }
  .kv b { font-weight: 600; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .css-box { position: relative; background: #1e2430; color: #d8dee9; border-radius: 8px;
             padding: 12px 14px; font-family: "SF Mono", Menlo, Consolas, monospace;
             font-size: 12px; line-height: 1.7; overflow: auto; white-space: pre; }
  .css-box .copy { position: absolute; top: 8px; right: 8px; height: 24px; padding: 0 10px;
    font-size: 11px; border: none; border-radius: 5px; background: rgba(255,255,255,.12);
    color: #fff; cursor: pointer; }
  .css-box .copy:hover { background: var(--blue); }
  .thumb-wrap { border: 1px solid var(--border); border-radius: 8px; padding: 10px;
                background: repeating-conic-gradient(#f0f1f4 0% 25%, #fff 0% 50%) 50% / 14px 14px;
                text-align: center; min-height: 80px; display: flex; align-items: center;
                justify-content: center; }
  .thumb-wrap img { max-width: 100%; max-height: 220px; }
  .text-preview { font-size: 15px; padding: 10px; border: 1px dashed var(--border);
                  border-radius: 8px; word-break: break-all; }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .btn-row .btn { flex: 1; justify-content: center; }
  .btn.blue { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.blue:hover { opacity: .9; color: #fff; }

  /* ---------- 上传弹层 ---------- */
  .upload-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none;
    align-items: center; justify-content: center; z-index: 100; }
  .upload-mask.show { display: flex; }
  .upload-card { width: 480px; background: #fff; border-radius: 12px; padding: 28px; text-align: center; }
  .dropzone { border: 2px dashed var(--border); border-radius: 10px; padding: 40px 20px;
    cursor: pointer; transition: .15s; }
  .dropzone:hover, .dropzone.drag { border-color: var(--blue); background: var(--blue-light); }
  .dropzone .big { font-size: 34px; }
  .dropzone p { margin-top: 10px; font-size: 13px; color: var(--text2); }
  .upload-status { margin-top: 16px; font-size: 13px; color: var(--text2); display: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    background: #1f2329; color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px;
    z-index: 200; display: none; }
</style>

<script>
let docMeta = null, layers = [], selectedId = null, showSpots = true;
let scale = 1, fitScale = 1;
let unit = 'px'; // px | rpx | %
const spotMap = {};   // id -> {node, el}

// ---------------- 工具 ----------------
function $(id){ return document.getElementById(id); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.display='none', 1800);
}
// 按当前单位格式化长度；axis: 'x' 用宽度基准，'y' 用高度基准（仅 % 时区分，rpx 恒用 750 宽度基准）
function fmtLen(v, axis){
  axis = axis || 'x';
  if(!docMeta) return Math.round(v) + 'px';
  if(unit === 'px') return Math.round(v) + 'px';
  if(unit === 'rpx'){
    const r = v * 750 / docMeta.width;
    return (Math.round(r * 100) / 100) + 'rpx';
  }
  const base = axis === 'y' ? docMeta.height : docMeta.width;
  const p = v * 100 / base;
  return (Math.round(p * 10) / 10) + '%';
}
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }

// ---------------- 文档列表 ----------------
async function loadDocs(){
  const res = await fetch('/api/docs');
  const docs = await res.json();
  const sel = $('docSelect');
  sel.innerHTML = '<option value="">— 选择设计稿 —</option>' +
    docs.map(d=>`<option value="${d.id}">${esc(d.name)}（${d.width}×${d.height}）</option>`).join('');
  if(docs.length) { sel.value = docs[0].id; loadDoc(docs[0].id); }
}

async function loadDoc(id){
  if(!id) return;
  const res = await fetch('/api/doc/' + id);
  if(!res.ok){ toast('加载失败'); return; }
  const data = await res.json();
  docMeta = data.meta; layers = data.layers;
  selectedId = null; spotMapClear();
  $('compositeImg').src = `/output/${id}/composite.png`;
  $('docInfo').textContent = `${docMeta.width} × ${docMeta.height} · ${docMeta.layer_count} 个图层`;
  $('layerCount').textContent = docMeta.layer_count;
  buildTree();
  $('stage').style.display = 'block';
  $('zoomCtrl').style.display = 'flex';
  const gs = $('guides');
  gs.setAttribute('viewBox', `0 0 ${docMeta.width} ${docMeta.height}`);
  gs.innerHTML = '';
  $('compositeImg').onload = () => { computeFit(); renderHotspots(); zoomFit(); };
  renderDetail();
}
$('docSelect').onchange = e => loadDoc(e.target.value);

// ---------------- 图层树 ----------------
const KIND_ICON = { group:'📁', text:'🅣', layer:'🖼' };
function buildTree(){
  const el = $('layerTree'); el.innerHTML = '';
  const walk = (nodes, depth) => {
    for(const n of nodes){
      const div = document.createElement('div');
      div.className = 'layer-item' + (n.visible ? '' : ' hidden-layer');
      div.dataset.id = n.id;
      div.style.paddingLeft = (12 + depth*14) + 'px';
      div.innerHTML = `<span class="icon">${KIND_ICON[n.kind]||'🖼'}</span><span class="nm">${esc(n.name)}</span>`;
      div.onclick = () => selectLayer(n.id, true);
      div.onmouseenter = () => highlightSpot(n.id, true);
      div.onmouseleave = () => highlightSpot(n.id, false);
      el.appendChild(div);
      walk(n.children||[], depth+1);
    }
  };
  walk(layers, 0);
}
function markActiveTree(){
  document.querySelectorAll('.layer-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.id === selectedId);
  });
}

// ---------------- 热区 ----------------
function spotMapClear(){ for(const k in spotMap) delete spotMap[k]; }
function collectSpots(nodes, holder){
  for(const n of nodes){
    if(!n.visible || n.w<=0 || n.h<=0) { collectSpots(n.children||[], holder); continue; }
    // 热区钳制到画布范围内（PSD 图层内容允许超出画布，显示时裁掉画布外部分）
    const l = Math.max(0, n.bbox[0]), t = Math.max(0, n.bbox[1]);
    const r = Math.min(docMeta.width,  n.bbox[2]), b = Math.min(docMeta.height, n.bbox[3]);
    if(r <= l || b <= t) { collectSpots(n.children||[], holder); continue; } // 完全在画布外
    const d = document.createElement('div');
    d.className = 'hotspot';
    d.style.left = (l*100/docMeta.width)+'%';
    d.style.top  = (t*100/docMeta.height)+'%';
    d.style.width  = ((r-l)*100/docMeta.width)+'%';
    d.style.height = ((b-t)*100/docMeta.height)+'%';
    d.onclick = e => { e.stopPropagation(); pickSpot(n, e); };
    d.onmouseenter = e => showDim(n, e);
    d.onmouseleave = hideDim;
    holder.appendChild(d);
    spotMap[n.id] = { node:n, el:d };
    collectSpots(n.children||[], holder);
  }
}
function renderHotspots(){
  const holder = $('hotspots'); holder.innerHTML=''; spotMapClear();
  holder.style.position='absolute'; holder.style.inset='0';
  collectSpots(layers, holder);
  holder.style.display = showSpots ? 'block' : 'none';
}
function toggleSpots(){
  showSpots = !showSpots;
  $('hotspots').style.display = showSpots ? 'block' : 'none';
  $('toggleSpots').textContent = showSpots ? '隐藏热区' : '显示热区';
}
// 点击命中：同一点下可能叠着多层热区（父组/子图层），
// 默认选最内层（面积最小）；对已选中层再点一次则向外逐层切换
function pickSpot(n, e){
  const sr = $('stage').getBoundingClientRect();
  const x = (e.clientX - sr.left) / scale;
  const y = (e.clientY - sr.top) / scale;
  const cands = [];
  for(const id in spotMap){
    const node = spotMap[id].node;
    const cl = Math.max(0, node.bbox[0]), ct = Math.max(0, node.bbox[1]);
    const cr = Math.min(docMeta.width, node.bbox[2]), cb = Math.min(docMeta.height, node.bbox[3]);
    if(cr <= cl || cb <= ct) continue;
    if(x >= cl && x <= cr && y >= ct && y <= cb) cands.push(node);
  }
  if(!cands.length){ selectLayer(n.id, false); return; }
  cands.sort((a, b) => a.w * a.h - b.w * b.h);
  let pick;
  if(cands.length === 1){
    pick = cands[0];
  }else{
    const cur = cands.findIndex(c => c.id === selectedId);
    pick = cur >= 0 ? cands[(cur + 1) % cands.length] : cands[0];
  }
  selectLayer(pick.id, false);
}
function highlightSpot(id, on){
  const s = spotMap[id]; if(!s) return;
  if(id !== selectedId) s.el.style.outline = on ? '2px dashed var(--blue)' : '';
  if(on) showDim(s.node, {target:s.el}); else hideDim();
}
function showDim(n, e){
  const lb = $('dimLabel');
  lb.textContent = `${fmtLen(n.w, 'x')} × ${fmtLen(n.h, 'y')}`;
  const stage = $('stage');
  const r = e.target.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  lb.style.left = Math.min(r.left - sr.left + r.width/2 - 30, sr.width - 70) + 'px';
  lb.style.top  = Math.max(r.top - sr.top - 22, 0) + 'px';
  lb.classList.add('show');
}
function hideDim(){ $('dimLabel').classList.remove('show'); }

// ---------------- 跟随鼠标的测量标注 ----------------
const SVG_NS = 'http://www.w3.org/2000/svg';
let lastMouse = null; // 记录鼠标设计稿坐标，缩放后重绘

function stageToDesign(e){
  const sr = $('stage').getBoundingClientRect();
  return { x: (e.clientX - sr.left) / scale, y: (e.clientY - sr.top) / scale };
}
let lastClient = null; // 鼠标屏幕坐标，缩放后据此重绘

function clearMeasure(){
  $('guides').innerHTML = '';
  ['labelDx','labelDy','labelPos','snapHint'].forEach(id => $(id).classList.remove('show'));
}

function svgLine(x1, y1, x2, y2, cls){
  const l = document.createElementNS(SVG_NS, 'line');
  l.setAttribute('x1', x1); l.setAttribute('y1', y1);
  l.setAttribute('x2', x2); l.setAttribute('y2', y2);
  l.setAttribute('class', cls);
  return l;
}

function showGuideLabel(el, text, designX, designY){
  el.textContent = text;
  el.style.left = (designX * scale) + 'px';
  el.style.top  = (designY * scale) + 'px';
  el.classList.add('show');
}

function renderMeasure(e){
  lastClient = { x: e.clientX, y: e.clientY };
  if(!docMeta){ return; }
  const m = stageToDesign(e);
  lastMouse = m;
  const gs = $('guides');
  gs.innerHTML = '';
  $('snapHint').classList.remove('show');

  // 鼠标坐标（相对画布原点）
  showGuideLabel($('labelPos'), `x:${fmtLen(m.x,'x')}, y:${fmtLen(m.y,'y')}`, m.x, m.y);

  if(!selectedId){ ['labelDx','labelDy'].forEach(id => $(id).classList.remove('show')); return; }
  const node = spotMap[selectedId] ? spotMap[selectedId].node : findNode(layers, selectedId);
  if(!node){ clearMeasure(); return; }
  const [al, at, ar, ab] = node.bbox;   // A = 选中图层

  // 虚线十字准线（贯穿画布）
  gs.appendChild(svgLine(0, m.y, docMeta.width, m.y, 'xhair'));
  gs.appendChild(svgLine(m.x, 0, m.x, docMeta.height, 'xhair'));

  const snap = findSnapTarget(m);
  if(snap){
    renderSnapMeasure(gs, node, snap.node, m);
  }else{
    renderFreeMeasure(gs, node, m);
  }
}

// ---------------- 吸附测量：选中图层 <-> 靠近的热区 ----------------
const SNAP_PAD = 20; // 设计稿像素，靠近该距离即吸附

function findSnapTarget(m){
  let best = null;
  for(const id in spotMap){
    if(id === selectedId) continue;
    const n = spotMap[id].node;
    if(n.w <= 0 || n.h <= 0) continue;
    const [x1, y1, x2, y2] = n.bbox;
    if(m.x >= x1 - SNAP_PAD && m.x <= x2 + SNAP_PAD &&
       m.y >= y1 - SNAP_PAD && m.y <= y2 + SNAP_PAD){
      // 取面积最小的（最内层/最精确的目标）
      if(!best || n.w * n.h < best.node.w * best.node.h) best = spotMap[id];
    }
  }
  return best;
}

// 计算两区间在单轴上的测量：优先朝向边缘间距；有重叠时改为对应边缘的对齐距离
// 返回 { gap, from, to, aligned }
function axisMeasure(a1, a2, b1, b2){
  if(b1 >= a2) return { gap: b1 - a2, from: a2, to: b1, aligned: false }; // B 在正方向
  if(a1 >= b2) return { gap: a1 - b2, from: b2, to: a1, aligned: false }; // B 在负方向
  // 有重叠：取差值更小的一对边缘（左-左 或 右-右）做对齐测量，带符号
  const ll = Math.abs(a1 - b1), rr = Math.abs(a2 - b2);
  if(ll <= rr) return { gap: b1 - a1, from: a1, to: b1, aligned: true };
  return { gap: b2 - a2, from: a2, to: b2, aligned: true };
}

function renderSnapMeasure(gs, a, b, m){
  const [al, at, ar, ab] = a.bbox;
  const [bl, bt, br, bb] = b.bbox;

  // 吸附目标高亮；名称固定提示在画布左上角（不遮挡标注）
  const rect = document.createElementNS(SVG_NS, 'rect');
  rect.setAttribute('x', bl); rect.setAttribute('y', bt);
  rect.setAttribute('width', br - bl); rect.setAttribute('height', bb - bt);
  rect.setAttribute('class', 'snap-rect');
  gs.appendChild(rect);
  const sh = $('snapHint');
  sh.textContent = '已吸附：' + b.name + `（${fmtLen(br - bl, 'x')} × ${fmtLen(bb - bt, 'y')}）`;
  sh.classList.add('show');

  // X 轴测量线的 y 位置：优先取两盒 y 区间交集中点，否则取中心连线中点
  const yLine = (Math.min(ab, bb) > Math.max(at, bt))
    ? (Math.max(at, bt) + Math.min(ab, bb)) / 2
    : ((at + ab) / 2 + (bt + bb) / 2) / 2;
  // Y 轴测量线的 x 位置：同理
  const xLine = (Math.min(ar, br) > Math.max(al, bl))
    ? (Math.max(al, bl) + Math.min(ar, br)) / 2
    : ((al + ar) / 2 + (bl + br) / 2) / 2;

  // X 轴：热区到热区的水平距离
  const mx = axisMeasure(al, ar, bl, br);
  gs.appendChild(svgLine(mx.from, yLine, mx.to, yLine, 'measure'));
  gs.appendChild(svgLine(mx.from, yLine - 8, mx.from, yLine + 8, 'edge-tick'));
  gs.appendChild(svgLine(mx.to, yLine - 8, mx.to, yLine + 8, 'edge-tick'));

  // Y 轴：热区到热区的垂直距离
  const my = axisMeasure(at, ab, bt, bb);
  gs.appendChild(svgLine(xLine, my.from, xLine, my.to, 'measure'));
  gs.appendChild(svgLine(xLine - 8, my.from, xLine + 8, my.from, 'edge-tick'));
  gs.appendChild(svgLine(xLine - 8, my.to, xLine + 8, my.to, 'edge-tick'));

  showGuideLabel($('labelDx'), `Δx ${fmtLen(mx.gap, 'x')}`, (mx.from + mx.to) / 2, yLine);
  showGuideLabel($('labelDy'), `Δy ${fmtLen(my.gap, 'y')}`, xLine, (my.from + my.to) / 2);
}

// ---------------- 自由测量：选中图层 -> 鼠标点 ----------------
function renderFreeMeasure(gs, node, m){
  const [l, t] = node.bbox;
  const dx = Math.round(m.x - l), dy = Math.round(m.y - t);

  // 红色测量线：选中图层左/上边缘 -> 鼠标位置
  gs.appendChild(svgLine(l, m.y, m.x, m.y, 'measure'));
  gs.appendChild(svgLine(m.x, t, m.x, m.y, 'measure'));
  // 图层边缘刻度短线
  gs.appendChild(svgLine(l, m.y - 8, l, m.y + 8, 'edge-tick'));
  gs.appendChild(svgLine(m.x - 8, t, m.x + 8, t, 'edge-tick'));
  // 鼠标点标记
  const dot = document.createElementNS(SVG_NS, 'circle');
  dot.setAttribute('cx', m.x); dot.setAttribute('cy', m.y);
  dot.setAttribute('r', 5); dot.setAttribute('fill', '#ff4d6a');
  gs.appendChild(dot);

  // 距离标签放在测量线中点
  showGuideLabel($('labelDx'), `Δx ${fmtLen(dx, 'x')}`, (l + m.x) / 2, m.y);
  showGuideLabel($('labelDy'), `Δy ${fmtLen(dy, 'y')}`, m.x, (t + m.y) / 2);
}

$('stage').addEventListener('mousemove', renderMeasure);
$('stage').addEventListener('mouseleave', () => { clearMeasure(); lastMouse = null; });

// ---------------- 选中 & 详情 ----------------
function selectLayer(id, fromTree){
  selectedId = id;
  for(const k in spotMap){
    spotMap[k].el.classList.toggle('selected', k===id);
    if(k===id) spotMap[k].el.style.zIndex = 3; else spotMap[k].el.style.zIndex = '';
  }
  markActiveTree();
  renderDetail();
  const item = document.querySelector(`.layer-item[data-id="${id}"]`);
  if(item && fromTree) item.scrollIntoView({block:'nearest'});
  const s = spotMap[id];
  if(s) s.el.scrollIntoView({block:'nearest', inline:'nearest'});
}

function cssSnippet(n){
  const L = [];
  L.push(`position: absolute;`);
  L.push(`left: ${fmtLen(n.bbox[0], 'x')};`);
  L.push(`top: ${fmtLen(n.bbox[1], 'y')};`);
  if(n.w) L.push(`width: ${fmtLen(n.w, 'x')};`);
  if(n.h) L.push(`height: ${fmtLen(n.h, 'y')};`);
  if(n.opacity < 1) L.push(`opacity: ${n.opacity};`);
  if(n.blend !== 'normal') L.push(`mix-blend-mode: ${n.blend};`);
  const ti = n.text_info;
  if(ti){
    if(ti.fonts && ti.fonts.length) L.push(`font-family: "${ti.fonts[0]}";`);
    if(ti.font_size != null){
      const fs = Array.isArray(ti.font_size) ? ti.font_size[0] : ti.font_size;
      L.push(`font-size: ${unit === 'rpx' ? fmtLen(fs, 'x') : fs + 'px'};`);
    }
    if(ti.color) L.push(`color: ${ti.color};`);
  }
  return L.join('\n');
}

function renderDetail(){
  const box = $('detail');
  if(!selectedId){
    box.innerHTML = '<div class="detail-empty">点击画布上的图层热区<br>或左侧图层列表查看标注信息</div>';
    return;
  }
  const n = spotMap[selectedId] ? spotMap[selectedId].node : findNode(layers, selectedId);
  if(!n) return;
  const kindName = {group:'图层组', text:'文本图层', layer:'图层'}[n.kind];
  let html = `
    <div class="detail-head">
      <div class="name">${esc(n.name)}</div>
      <span class="kind">${kindName}${n.visible?'':' · 已隐藏'}</span>
    </div>
    <div class="detail-body">
      <div class="sec-title">位置 / 尺寸</div>
      <div class="kv"><span>X</span><b>${fmtLen(n.bbox[0], 'x')}</b></div>
      <div class="kv"><span>Y</span><b>${fmtLen(n.bbox[1], 'y')}</b></div>
      <div class="kv"><span>宽</span><b>${fmtLen(n.w, 'x')}</b></div>
      <div class="kv"><span>高</span><b>${fmtLen(n.h, 'y')}</b></div>
      <div class="kv"><span>透明度</span><b>${Math.round(n.opacity*100)}%</b></div>
      <div class="kv"><span>混合模式</span><b>${n.blend}</b></div>` +
      (n.bbox[0] < 0 || n.bbox[1] < 0 || n.bbox[2] > docMeta.width || n.bbox[3] > docMeta.height
        ? `<div class="kv"><span>超出画布</span><b>是（PSD 原始数据，热区已按画布裁剪显示）</b></div>` : '');

  if(n.kind === 'text' && n.text_info){
    const ti = n.text_info;
    html += `<div class="sec-title">文本</div>
      <div class="text-preview" ${ti.fonts&&ti.fonts[0]?`style="font-family:'${ti.fonts[0]}'"`:''}>${esc(ti.text)}</div>`;
    if(ti.fonts && ti.fonts.length)
      html += `<div class="kv"><span>字体</span><b>${esc(ti.fonts.join(', '))}</b></div>`;
    if(ti.font_size != null)
      html += `<div class="kv"><span>字号</span><b>${Array.isArray(ti.font_size)?ti.font_size.join('/'):ti.font_size}px</b></div>`;    if(ti.color)
      html += `<div class="kv"><span>颜色</span><b>${ti.color}</b></div>`;
  }

  html += `<div class="sec-title">CSS 示例</div>
    <div class="css-box"><button class="copy" onclick="copyCSS()">复制</button><code id="cssCode">${esc(cssSnippet(n))}</code></div>
    <div class="sec-title">素材导出</div>
    <div class="thumb-wrap" id="thumbWrap"><span class="spinner"></span></div>
    <div class="btn-row">
      <button class="btn blue" onclick="downloadAsset()">导出 PNG 素材</button>
    </div>
  </div>`;
  box.innerHTML = html;
  loadThumb(n.id);
}

function findNode(nodes, id){
  for(const n of nodes){
    if(n.id === id) return n;
    const r = findNode(n.children||[], id);
    if(r) return r;
  }
  return null;
}

async function loadThumb(id){
  const wrap = $('thumbWrap'); if(!wrap) return;
  const img = new Image();
  img.onload = () => { if($('thumbWrap')===wrap){ wrap.innerHTML=''; wrap.appendChild(img); } };
  img.onerror = () => { if($('thumbWrap')===wrap) wrap.innerHTML = '<span style="font-size:12px;color:#9ca3af">该图层无可导出像素（如空组）</span>'; };
  img.src = `/api/layer/${docMeta.id}/${id}/png`;
}
function downloadAsset(){
  const n = spotMap[selectedId] ? spotMap[selectedId].node : findNode(layers, selectedId);
  if(!n) return;
  const a = document.createElement('a');
  a.href = `/api/layer/${docMeta.id}/${selectedId}/png?download=1`;
  a.download = `${n.name}.png`;
  a.click();
  toast('素材已导出');
}
function copyCSS(){
  const code = $('cssCode').textContent;
  navigator.clipboard.writeText(code).then(()=>toast('CSS 已复制')).catch(()=>{
    const ta = document.createElement('textarea'); ta.value = code;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    ta.remove(); toast('CSS 已复制');
  });
}

// ---------------- 缩放 ----------------
function computeFit(){
  const wrap = $('canvasWrap');
  fitScale = Math.min((wrap.clientWidth - 48) / docMeta.width,
                      (wrap.clientHeight - 48) / docMeta.height, 1);
}
function applyZoom(){
  const st = $('stage');
  st.style.width  = (docMeta.width * scale) + 'px';
  st.style.height = (docMeta.height * scale) + 'px';
  $('zoomLabel').textContent = Math.round(scale*100) + '%';
  // 缩放后按鼠标当前屏幕位置重绘测量线
  if(lastClient && docMeta){
    const sr = st.getBoundingClientRect();
    const inside = lastClient.x >= sr.left && lastClient.x <= sr.right &&
                   lastClient.y >= sr.top  && lastClient.y <= sr.bottom;
    if(inside) renderMeasure(lastClient);
    else { clearMeasure(); lastClient = null; }
  }
}
function zoomFit(){ computeFit(); scale = fitScale; applyZoom(); }
function zoomBy(f){
  const old = scale; scale = Math.min(8, Math.max(0.1, scale*f));
  applyZoom();
  if(f > 1){ $('canvasWrap').scrollLeft *= scale/old; $('canvasWrap').scrollTop *= scale/old; }
}

// ---------------- 单位切换 ----------------
document.querySelectorAll('#unitSeg button').forEach(b => {
  b.onclick = () => {
    unit = b.dataset.u;
    document.querySelectorAll('#unitSeg button').forEach(x => x.classList.toggle('on', x === b));
    renderDetail();
    if(lastClient) renderMeasure(lastClient);
  };
});

// ---------------- 鼠标滚轮缩放（以光标为中心） ----------------
$('canvasWrap').addEventListener('wheel', e => {
  if(!docMeta) return;
  if(e.shiftKey) return; // Shift + 滚轮保持横向滚动
  e.preventDefault();
  const wrap = $('canvasWrap');
  const sr = $('stage').getBoundingClientRect();
  // 光标下的设计稿坐标（缩放前后保持不变）
  const dx = (e.clientX - sr.left) / scale;
  const dy = (e.clientY - sr.top) / scale;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  scale = Math.min(8, Math.max(0.1, scale * factor));
  applyZoom();
  // 调整滚动量，让光标下的点钉在原位
  const sr2 = $('stage').getBoundingClientRect();
  wrap.scrollLeft += (e.clientX - dx * scale) - sr2.left;
  wrap.scrollTop  += (e.clientY - dy * scale) - sr2.top;
}, { passive: false });

// ---------------- 上传 ----------------
function showUpload(){ $('uploadMask').classList.add('show'); resetUpload(); }
function resetUpload(){
  $('dropzone').style.display='block'; $('uploadStatus').style.display='none';
  $('fileInput').value='';
}
function hideUpload(){ $('uploadMask').classList.remove('show'); }
$('uploadMask').onclick = e => { if(e.target === $('uploadMask')) hideUpload(); };

async function handleFile(file){
  if(!file || !file.name.toLowerCase().endsWith('.psd')){ toast('请选择 .psd 文件'); return; }
  $('dropzone').style.display='none';
  const st = $('uploadStatus'); st.style.display='block';
  st.innerHTML = '<span class="spinner"></span>上传中 0%';

  const fd = new FormData(); fd.append('file', file);
  const finish = (ok, msg) => {
    if(ok){
      st.innerHTML = '✅ 解析完成';
      loadDocs().then(() => { $('docSelect').value = msg.id; });
      loadDoc(msg.id);
      setTimeout(hideUpload, 500);
    }else{
      st.innerHTML = '❌ ' + msg +
        '<br><a href="#" onclick="resetUpload();return false" style="color:#2f7df6">重新选择</a>' +
        '<br><span style="font-size:12px">提示：若反复失败，请直接用浏览器打开 ' +
        '<a href="http://127.0.0.1:8642" target="_blank" style="color:#2f7df6">http://127.0.0.1:8642</a> 后重试</span>';
    }
  };

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = e => {
    if(e.lengthComputable){
      const pct = Math.round(e.loaded / e.total * 100);
      st.innerHTML = `<span class="spinner"></span>上传中 ${pct}%（大文件解析需十几秒）`;
    }
  };
  xhr.onload = () => {
    try{
      const data = JSON.parse(xhr.responseText);
      if(xhr.status === 200) finish(true, data);
      else finish(false, data.error || `服务器错误 (${xhr.status})`);
    }catch(_){ finish(false, `服务器响应异常 (${xhr.status})`); }
  };
  xhr.onerror = () => finish(false, '网络错误：无法连接到服务');
  xhr.ontimeout = () => finish(false, '上传超时');
  xhr.timeout = 600000; // 10 分钟，大文件解析较慢
  xhr.send(fd);
}
$('fileInput').onchange = e => handleFile(e.target.files[0]);
const dz = $('dropzone');
dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
dz.ondragleave = () => dz.classList.remove('drag');
dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); };

// 画布空白处点击取消选中
$('canvasWrap').onclick = e => {
  if(e.target === $('canvasWrap') || e.target.classList.contains('composite')){
    selectLayer(null);
  }
};

loadDocs();
</script>
